# The stack's only public door: everything arrives on :80 or :443 and is
# handed to a container on the private compose network. `web`, `admin` and `api` publish no host
# ports of their own, so this file is the whole attack surface.
#
# Serving both apps from one origin is the point. The browser calls
# /api/v1/... on the same host it loaded the page from, which means the
# session cookie is first-party and CORS never enters into it.

upstream hamdastan_web {
    server web:3000;
    keepalive 16;
}

upstream hamdastan_admin {
    server admin:3001;
    keepalive 16;
}

# `api-edge` is the API's alias on the `edge` network (docker-compose.prod.yml),
# where nginx has the fixed address the API's TRUST_PROXY names.
upstream hamdastan_api {
    server api-edge:4000;
    keepalive 16;
}

# ── Edge rate limits ─────────────────────────────────────────
# The coarse half of rate limiting, per connecting address — which nginx
# knows for certain, so nothing here can be forged. The API's own limits
# (apps/api/src/middleware/rate-limit.ts) are the fine half: per account,
# per session, per activity. These are set well above any real visitor so
# that a mobile carrier's NAT, many people on one address, is never what
# trips them; they exist to stop floods before they cost the API anything.
limit_req_zone $binary_remote_addr zone=api:10m      rate=20r/s;
limit_req_zone $binary_remote_addr zone=sign_in:10m  rate=30r/m;
limit_req_status    429;
limit_req_log_level warn;

# ── Access log ───────────────────────────────────────────────
# What an operator needs to see latency and errors per request, and to
# follow one request into the API's log by its id. `$uri`, not `$request`:
# a query string can carry a phone number or a search, and has no business
# in a log kept for weeks. No cookies, no headers that carry a token.
log_format timed '$remote_addr [$time_iso8601] "$request_method $uri" $status '
                 '$body_bytes_sent rt=$request_time urt=$upstream_response_time '
                 'rid=$request_id';

# Next streams RSC payloads; buffering them in nginx would hold the whole
# response before a byte reaches the browser.
proxy_http_version 1.1;
proxy_buffering off;
proxy_read_timeout 120s;

# Who the client is, written by nginx and never relayed: X-Forwarded-For is
# *replaced* with the connecting address, not appended to, so a value the
# client sent cannot survive to the upstream. The API trusts this header from
# nginx's address alone; it is the only thing a per-address limit counts by.
# `Forwarded` (RFC 7239) is dropped for the same reason.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header Forwarded         "";
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
# nginx's own id for the request, never one the client sent: the API logs it
# as `reqId` and echoes it back, the access log writes it as `rid`.
proxy_set_header X-Request-ID      $request_id;

# Every header above is set here, once, and nowhere else. A location that
# sets even one `proxy_set_header` of its own inherits none of these — which
# would silently drop X-Forwarded-For and put every client under one
# address. Add a header here, never in a location or in nginx-api.inc.

# A WebSocket upgrade passes through; anything else sends an empty
# Connection header, which is what lets nginx reuse the `keepalive`
# connections to the upstreams above. `close` here would open a fresh TCP
# connection to web or api for every request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ── Plain HTTP ───────────────────────────────────────────────
# Everything is sent to the canonical https://hamdaastaan.ir — including
# requests by bare IP and by www. The one exception is the probe:
# scripts/deploy.sh and the container healthcheck call http://127.0.0.1/_up
# from the server itself and need the real answer, not a redirect.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location = /_up {
        proxy_pass http://hamdastan_api/health;
    }

    location / {
        return 301 https://hamdaastaan.ir$request_uri;
    }
}

# ── TLS ──────────────────────────────────────────────────────
# The certificate is Let's Encrypt's, issued and renewed by certbot on the
# host into /etc/letsencrypt, which docker-compose.prod.yml mounts read-only.
# nginx refuses to start without it — see README "Deployment" for the
# first issue.
ssl_certificate     /etc/letsencrypt/live/hamdaastaan.ir/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/hamdaastaan.ir/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

# www is not a second home for the product; it redirects to the apex so the
# session cookie only ever lives on one host.
server {
    listen 443 ssl;
    http2 on;
    server_name www.hamdaastaan.ir;
    server_tokens off;

    return 301 https://hamdaastaan.ir$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name hamdaastaan.ir;

    client_max_body_size 20m;

    # Nothing about the proxy itself needs advertising.
    server_tokens off;

    # No includeSubDomains or preload: those are hard to take back.
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/access.log timed;

    # A refused request answers in the API's own envelope, with a Retry-After,
    # so the clients' retry policy treats it like the API's own 429.
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 429 '{"ok":false,"error":{"code":"RATE_LIMITED","message":"درخواست‌ها زیاد بود، کمی بعد دوباره امتحان کن"}}';
    }

    # ── The backend ───────────────────────────────────────────
    # API_PREFIX in packages/config. Matching the version too, rather than a
    # bare /api/, leaves /api/* free for the Next route handlers in apps/web.
    location /api/v1/ {
        proxy_pass http://hamdastan_api;
        include /etc/nginx/conf.d/hamdastan-api.inc;

        limit_req zone=api burst=40 nodelay;
    }

    # Sign-in and refresh, product and admin: the routes a credential
    # stuffer or a code guesser hits. Thirty a minute per address, with room
    # for a burst — the API's per-number lock is the real guard behind it.
    location ~ ^/api/v1/(auth|admin/auth)/ {
        proxy_pass http://hamdastan_api;
        include /etc/nginx/conf.d/hamdastan-api.inc;

        limit_req zone=sign_in burst=10 nodelay;
    }

    # ── Probes ────────────────────────────────────────────────
    # Underscored so they cannot collide with a product route. `_up` is what
    # an uptime monitor should watch: it reports the API's view of the
    # database, so a healthy 200 means the whole stack is serving.
    location = /_up {
        proxy_pass http://hamdastan_api/health;
    }

    location = /_up/web {
        proxy_pass http://hamdastan_web/api/health;
    }

    # ── Artwork ───────────────────────────────────────────────
    # Next serves `public/` with `max-age=0`, so every screen revalidated its
    # artwork — some of it over a megabyte — on every visit. These names carry
    # no content hash, so the cache is a week rather than forever: replacing
    # a file means giving it a new name (`-v2`), as the world banners do.
    location ~ ^/(images|icons)/ {
        proxy_pass http://hamdastan_web;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        # An add_header here drops the server's, so HSTS is repeated.
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # ── The admin panel ───────────────────────────────────────
    # apps/admin is built with basePath /admin (apps/admin/src/lib/base-path.ts),
    # so the path is passed through unchanged. Same origin as the product, so
    # the hd_admin cookie and /api/v1 need nothing extra. `= /admin` and
    # `/admin/` rather than a bare `/admin` prefix, which would also capture
    # a product route such as /administrator. Nothing in apps/web links here.
    location = /admin {
        proxy_pass http://hamdastan_admin;
    }

    location /admin/ {
        proxy_pass http://hamdastan_admin;
    }

    # ── The product ───────────────────────────────────────────
    location / {
        proxy_pass http://hamdastan_web;
    }
}
