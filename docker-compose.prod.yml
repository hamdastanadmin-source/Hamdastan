# Production overlay. Always used together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# which is what `scripts/deploy.sh` runs on the server. Three things change:
#
#   1. `web` and `api` stop publishing host ports. They are reachable only
#      over the private compose network, so nginx below (:80 and :443) is the
#      single door.
#   2. The browser bundle is built against the public URL. NEXT_PUBLIC_
#      variables are baked in at build time, so this has to be a build
#      argument — see packages/config/app/app.config.ts.
#   3. The API applies pending migrations as it boots. There is one instance,
#      and the advisory lock in apps/api/src/data/migrate.ts makes that safe
#      even when there is not.
#   4. nginx reaches the API over `edge`, a network of its own on which
#      nginx has a fixed address, and the API trusts X-Forwarded-For from
#      that address alone (TRUST_PROXY). `web` and `admin` reach the API over
#      the default network and are not trusted: their server-side calls are
#      counted by the session cookie they carry, never by a client address
#      they could relay. Change EDGE_SUBNET / NGINX_EDGE_IP in the server's
#      .env only if the default range collides with one already on the host.

services:
  api:
    # !override replaces the base file's list instead of appending to it.
    ports: !override []
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - API_PORT=4000
      - API_HOST=0.0.0.0
      # Same origin as the pages, because everything arrives through nginx.
      - CORS_ORIGINS=${PUBLIC_BASE_URL}
      - DATABASE_MIGRATE_ON_BOOT=true
      - TRUST_PROXY=${NGINX_EDGE_IP:-10.250.250.2}
    networks:
      default: {}
      edge:
        # nginx's upstream names this alias, which exists only on `edge` —
        # so its connections arrive from its fixed address there.
        aliases: [api-edge]

  web:
    ports: !override []
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_BASE_URL}
        NEXT_PUBLIC_WEB_BASE_URL: ${PUBLIC_BASE_URL}
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Server-side rendering stays on the compose network; the browser goes
      # back out through nginx.
      - API_BASE_URL=http://api:4000
      - NEXT_PUBLIC_API_BASE_URL=${PUBLIC_BASE_URL}
      - WEB_BASE_URL=${PUBLIC_BASE_URL}
      - NEXT_PUBLIC_WEB_BASE_URL=${PUBLIC_BASE_URL}
    volumes:
      # next/image's resized copies. Without a volume they live in the
      # container and every deploy starts cold: the first visitors wait while
      # each world banner is re-encoded.
      - web-image-cache:/app/apps/web/.next/cache

  admin:
    # The base file keeps the panel behind a profile so a development
    # `docker compose up` skips it; in production it always runs, behind
    # nginx at /admin.
    profiles: !reset []
    ports: !override []
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_BASE_URL}
        NEXT_PUBLIC_WEB_BASE_URL: ${PUBLIC_BASE_URL}
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - API_BASE_URL=http://api:4000
      - NEXT_PUBLIC_API_BASE_URL=${PUBLIC_BASE_URL}

  nginx:
    container_name: hamdastan-nginx
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Included by the API locations in nginx.conf.
      - ./deploy/nginx-api.inc:/etc/nginx/conf.d/hamdastan-api.inc:ro
      # Let's Encrypt certificates, issued and renewed by certbot on the host.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      default: {}
      edge:
        ipv4_address: ${NGINX_EDGE_IP:-10.250.250.2}
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      # nginx resolves its upstreams once, at start, and refuses to start
      # when one does not resolve.
      admin:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/_up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  edge:
    # Nothing on it needs the internet; the API's egress (database, SMS) is
    # on the default network.
    internal: true
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-10.250.250.0/29}

volumes:
  web-image-cache:
