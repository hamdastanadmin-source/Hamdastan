services:
  web:
    container_name: hamdastan-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Server-side calls stay on the compose network; the browser needs a
      # URL it can reach from the host.
      - API_BASE_URL=http://api:4000
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:4000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  api:
    container_name: hamdastan-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - API_PORT=4000
      - API_HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The admin panel is not part of the default stack yet — it is still an
  # empty shell. Bring it up with:  docker compose --profile admin up
  admin:
    container_name: hamdastan-admin
    profiles: ["admin"]
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - API_BASE_URL=http://api:4000
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:4000
    depends_on:
      api:
        condition: service_healthy
